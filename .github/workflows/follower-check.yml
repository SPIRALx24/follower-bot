name: follower-check
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - id: check
        run: python check.py
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - if: steps.check.outputs.pre == 'true'
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add pre_sent.txt
          git commit -m "pre alert sent"
          git push
      - if: steps.check.outputs.reached == 'true'
        run: gh workflow disable follower-check.yml
        env:
          GH_TOKEN: ${{ github.token }}
